<footer class="site-footer h-card">
  <data class="u-url" href="{{ '/' | relative_url }}"></data>

  <div class="wrapper">
    <nav class="footer-nav" aria-label="Footer">
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/archives/' | relative_url }}">归档</a>
      <a href="{{ '/categories/' | relative_url }}">分类</a>
      <a href="{{ '/tags/' | relative_url }}">标签</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
      <a href="{{ '/feed.xml' | relative_url }}" rel="alternate" type="application/atom+xml">RSS</a>
      {%- if site.github_username %}
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>
      {%- endif %}
      {%- if site.twitter_username %}
      <a href="https://twitter.com/{{ site.twitter_username }}" target="_blank" rel="noopener">X</a>
      {%- endif %}
      {%- if site.email %}
      <a href="mailto:{{ site.email }}">Email</a>
      {%- endif %}
    </nav>

    <div class="footer-meta">
      <span id="busuanzi_container_site_pv" style="display: none;">
        <span id="busuanzi_value_site_pv"></span> 次浏览
      </span>
      <span id="busuanzi_container_site_uv" style="display: none;">
        <span class="separator">·</span>
        <span id="busuanzi_value_site_uv"></span> 位访客
      </span>
      <span class="separator">·</span>
      <span>© {{ 'now' | date: "%Y" }} {{ site.author.name | default: site.title }}</span>
      <span class="separator">·</span>
      <span>Built with <a href="https://jekyllrb.com/" target="_blank" rel="noopener">Jekyll</a></span>
    </div>
  </div>
</footer>

<script>
  // 不蒜子加载完成后再显示统计，避免先出现空数字
  (function () {
    const ids = ['busuanzi_container_site_pv', 'busuanzi_container_site_uv'];
    const timer = setInterval(function () {
      if (typeof busuanzi === 'undefined') return;
      clearInterval(timer);
      ids.forEach(function (id) {
        const el = document.getElementById(id);
        if (el) el.style.display = 'inline-flex';
      });
    }, 100);
    setTimeout(function () { clearInterval(timer); }, 5000);
  })();
</script>

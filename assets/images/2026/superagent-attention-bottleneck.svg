  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#s1)"><line x1="172" y1="118" x2="84" y2="186"/><line x1="182" y1="123" x2="148" y2="186"/><line x1="198" y1="123" x2="212" y2="186"/><line x1="208" y1="118" x2="276" y2="186"/></g>
  <text x="190" y="262" text-anchor="middle" font-size="12" fill="#64748b">切换、记上下文、盯进度</text>

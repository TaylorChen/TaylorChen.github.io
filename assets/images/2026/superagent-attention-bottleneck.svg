  <g fill="#0ea5e9"><rect x="440" y="210" width="50" height="30" rx="6"/><rect x="505" y="210" width="50" height="30" rx="6"/><rect x="570" y="210" width="50" height="30" rx="6"/><rect x="635" y="210" width="50" height="30" rx="6"/><rect x="700" y="210" width="40" height="30" rx="6" opacity=".5"/></g>
  <g text-anchor="middle" font-size="11" fill="#fff"><text x="465" y="230">W</text><text x="530" y="230">W</text><text x="595" y="230">W</text><text x="660" y="230">W</text><text x="720" y="230">…</text></g>

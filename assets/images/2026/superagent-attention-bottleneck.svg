  <line x1="380" y1="48" x2="380" y2="270" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <circle cx="190" cy="100" r="24" fill="#f59e0b"/><text x="190" y="105" text-anchor="middle" font-size="12" fill="#fff">人</text>
  <g fill="#0ea5e9"><rect x="50" y="190" width="56" height="34" rx="6"/><rect x="118" y="190" width="56" height="34" rx="6"/><rect x="186" y="190" width="56" height="34" rx="6"/><rect x="254" y="190" width="56" height="34" rx="6"/></g>

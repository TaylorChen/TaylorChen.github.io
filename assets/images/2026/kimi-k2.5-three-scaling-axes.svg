<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K2.5 的三条 Scaling 轴</title>
  <desc id="desc">MuonClip 提高 Token 效率，Kimi Linear 扩大有效上下文，PARL 增加有效并行 Agent 数量，三者共同提升 Agentic Intelligence。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="600" height="900" rx="18" fill="url(#bg)"/>
  <text x="300" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Kimi K2.5 的三条 Scaling 轴</text>
  <text x="300" y="76" text-anchor="middle" font-size="16" fill="#64748b">更强先验 × 更长轨迹 × 更宽并行</text>

  <g>
    <rect x="50" y="110" width="500" height="170" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <circle cx="105" cy="165" r="29" fill="#4f46e5"/>
    <text x="105" y="174" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">1</text>
    <text x="155" y="150" font-size="22" font-weight="700" fill="#312e81">Token Efficiency</text>
    <text x="155" y="181" font-size="18" font-weight="600" fill="#4f46e5">MuonClip</text>
    <line x1="80" y1="210" x2="520" y2="210" stroke="#e2e8f0"/>
    <text x="80" y="242" font-size="17" fill="#334155">同样的数据学到更多</text>
    <text x="520" y="242" text-anchor="end" font-size="16" fill="#64748b">Agent：更强先验</text>
  </g>

  <line x1="300" y1="282" x2="300" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="50" y="325" width="500" height="170" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <circle cx="105" cy="380" r="29" fill="#0284c7"/>
    <text x="105" y="389" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">2</text>
    <text x="155" y="365" font-size="22" font-weight="700" fill="#0c4a6e">Context Length</text>
    <text x="155" y="396" font-size="18" font-weight="600" fill="#0284c7">Kimi Linear / KDA</text>
    <line x1="80" y1="425" x2="520" y2="425" stroke="#e2e8f0"/>
    <text x="80" y="457" font-size="17" fill="#334155">更长轨迹，保留关键状态</text>
    <text x="520" y="457" text-anchor="end" font-size="16" fill="#64748b">Agent：时间深度</text>
  </g>

  <line x1="300" y1="497" x2="300" y2="535" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="50" y="540" width="500" height="170" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <circle cx="105" cy="595" r="29" fill="#059669"/>
    <text x="105" y="604" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">3</text>
    <text x="155" y="580" font-size="22" font-weight="700" fill="#064e3b">Number of Agents</text>
    <text x="155" y="611" font-size="18" font-weight="600" fill="#059669">Agent Swarm / PARL</text>
    <line x1="80" y1="640" x2="520" y2="640" stroke="#e2e8f0"/>
    <text x="80" y="672" font-size="17" fill="#334155">独立子任务，并发完成</text>
    <text x="520" y="672" text-anchor="end" font-size="16" fill="#64748b">Agent：执行宽度</text>
  </g>

  <line x1="300" y1="712" x2="300" y2="750" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="755" width="400" height="100" rx="18" fill="#0f172a"/>
  <text x="300" y="798" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">Agentic Intelligence</text>
  <text x="300" y="830" text-anchor="middle" font-size="16" fill="#cbd5e1">能力、持续时间与并行规模共同扩展</text>
</svg>
